name: Tiny RPG Codex Runner
on:
  workflow_dispatch:
    inputs:
      jira_issue:
        description: "Jira task key (e.g. TINY-7)"
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: tiny-rpg-codex
  cancel-in-progress: false
jobs:
  codex:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_KEY: ${{ inputs.jira_issue }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get Jira issue and prepare task
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,base64
          key=os.environ['ISSUE_KEY']
          if not (key.startswith('TINY-') and key[5:].isdigit()):
              raise ValueError('Invalid Jira task key')
          if not os.environ['JIRA_EMAIL'] or not os.environ['JIRA_API_TOKEN']:
              raise ValueError('Configure JIRA_EMAIL and JIRA_API_TOKEN as GitHub Actions secrets')
          auth=base64.b64encode((os.environ['JIRA_EMAIL']+':'+os.environ['JIRA_API_TOKEN']).encode()).decode()
          req=urllib.request.Request('https://mehmetciwan02-1793014553432.atlassian.net/rest/api/3/issue/'+key+'?fields=summary,description',headers={'Authorization':'Basic '+auth,'Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as response: issue=json.load(response)
          def text(x):
              if isinstance(x,str):return x
              if isinstance(x,list):return '\n'.join(map(text,x))
              if isinstance(x,dict):return x.get('text','')+'\n'+text(x.get('content',[]))
              return ''
          with open('/tmp/tiny-prompt.txt','w') as f:
              f.write('Complete only '+key+': '+issue['fields']['summary']+'\n'+text(issue['fields'].get('description'))[:12000])
          PY
      - name: Prepare branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "codex/$ISSUE_KEY-$GITHUB_RUN_ID"
          cat > /tmp/guardrails.txt <<'END'
          Implement ONLY the Jira task attached below in this TinyRpg Unity project.
          Preserve existing game controls, scenes, .meta files, original asset packs and GUIDs.
          Single player means Tiny Troopers style shared squad commands; no character switching.
          Do not edit .github, credentials, policies, workflows, or project Git configuration.
          Inspect existing code and GDD first. Do available checks and report limitations.
          Unity Editor/Play Mode/rig/VFX checks must not be claimed unless executed.
          END
          cat /tmp/tiny-prompt.txt >> /tmp/guardrails.txt
      - name: Run Codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt-file: /tmp/guardrails.txt
          output-file: /tmp/codex-report.txt
      - name: Open PR
        run: |
          set -euo pipefail
          test -n "$(git status --porcelain)"
          if git status --porcelain | grep -Eq '(\.github/|\.env|/Library/|/Temp/)'; then
            echo "Protected paths changed"; exit 1
          fi
          git add -A
          git diff --cached --check
          git commit -m "$ISSUE_KEY: Codex implementation"
          git push origin HEAD
          gh pr create --base main --head "$(git branch --show-current)" --title "$ISSUE_KEY: Codex implementation" --body "Automated Codex implementation. Unity visual tests are not guaranteed."
