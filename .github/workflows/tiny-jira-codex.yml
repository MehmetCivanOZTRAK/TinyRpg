name: Tiny RPG Codex Runner
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      jira_issue:
        description: "Jira task key (for example TINY-8); leave empty for the next task"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tiny-rpg-codex
  cancel-in-progress: false

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check required secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [[ -z "$OPENAI_API_KEY" || -z "$JIRA_EMAIL" || -z "$JIRA_API_TOKEN" ]]; then
            echo 'Missing OPENAI_API_KEY, JIRA_EMAIL, or JIRA_API_TOKEN secret'; exit 1
          fi
          if [[ -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" || ( -z "$UNITY_LICENSE" && -z "$UNITY_SERIAL" ) ]]; then
            echo 'Missing Unity license credentials (UNITY_EMAIL, UNITY_PASSWORD, and UNITY_LICENSE or UNITY_SERIAL)'; exit 1
          fi
      - name: Check Jira task logic
        run: python3 .github/scripts/jira_tasks.py selftest
      - name: Select task and set In Progress
        id: task
        env:
          ISSUE_INPUT: ${{ inputs.jira_issue }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/jira_tasks.py prepare
      - name: Prepare task branch
        if: steps.task.outputs.issue != ''
        env:
          ISSUE_KEY: ${{ steps.task.outputs.issue }}
        run: git switch -c "codex/${ISSUE_KEY}-${GITHUB_RUN_ID}"
      - name: Implement Jira task with Codex
        if: steps.task.outputs.issue != ''
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt-file: ${{ runner.temp }}/tiny-task.txt
          output-file: ${{ runner.temp }}/codex-report.txt
      - name: Open task pull request
        if: steps.task.outputs.issue != ''
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_KEY: ${{ steps.task.outputs.issue }}
        run: |
          set -euo pipefail
          test -n "$(git status --porcelain)"
          if [[ -n "$(git status --porcelain -- .github .gitignore)" ]]; then
            echo 'Codex changed protected automation files'; exit 1
          fi
          if git status --porcelain -uall | cut -c4- | grep -Ev '^(Assets|Packages|ProjectSettings)/'; then
            echo 'Codex changed files outside Unity project directories'; exit 1
          fi
          git add -- Assets Packages ProjectSettings
          git diff --cached --check -- '*.cs' '*.py' '*.json' '*.yml'
          test -n "$(git diff --cached --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "${ISSUE_KEY}: Codex implementation"
          gh auth setup-git
          git push origin HEAD
          pr_url=$(gh pr create --base main --head "$(git branch --show-current)" --title "${ISSUE_KEY}: Codex implementation" --body "Automated implementation for ${ISSUE_KEY}. Unity test results are attached to this run; visual rig and effect checks require Unity Editor review.")
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
      - name: Unity compile and tests
        if: steps.publish.outputs.pr_url != ''
        id: unity
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.12f1
          testMode: All
          coverageEnabled: false
      - name: Save Unity test results
        if: always() && steps.publish.outputs.pr_url != ''
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results-${{ steps.task.outputs.issue }}
          path: ${{ steps.unity.outputs.artifactsPath }}
          if-no-files-found: warn
      - name: Merge after Unity checks pass
        if: steps.unity.outcome == 'success'
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.publish.outputs.pr_url }}
        run: gh pr merge "$PR_URL" --squash --delete-branch
      - name: Report completion to Jira
        if: steps.merge.outcome == 'success'
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_KEY: ${{ steps.task.outputs.issue }}
          PR_URL: ${{ steps.publish.outputs.pr_url }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/jira_tasks.py complete
      - name: Mark failed task as blocked in Jira
        if: failure() && steps.task.outputs.issue != '' && steps.merge.outcome != 'success'
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          ISSUE_KEY: ${{ steps.task.outputs.issue }}
          PR_URL: ${{ steps.publish.outputs.pr_url }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/jira_tasks.py blocked
