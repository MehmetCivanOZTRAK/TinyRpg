name: Tiny RPG Codex Runner
on:
  workflow_dispatch:
    inputs:
      jira_issue:
        description: "Jira task key (for example TINY-8); leave empty for the next task"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tiny-rpg-codex
  cancel-in-progress: false

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check required secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          if [[ -z "$OPENAI_API_KEY" || -z "$JIRA_EMAIL" || -z "$JIRA_API_TOKEN" ]]; then
            echo 'Missing OPENAI_API_KEY, JIRA_EMAIL, or JIRA_API_TOKEN secret'; exit 1
          fi
      - name: Check Jira task logic
        run: python3 .github/scripts/jira_tasks.py selftest
      - name: Select task and set In Progress
        id: task
        env:
          ISSUE_INPUT: ${{ inputs.jira_issue }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/jira_tasks.py prepare
      - name: Prepare task branch
        if: steps.task.outputs.issue != ''
        env:
          ISSUE_KEY: ${{ steps.task.outputs.issue }}
        run: git switch -c "codex/${ISSUE_KEY}-${GITHUB_RUN_ID}"
      - name: Implement Jira task with Codex
        if: steps.task.outputs.issue != ''
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt-file: ${{ runner.temp }}/tiny-task.txt
          output-file: ${{ runner.temp }}/codex-report.txt
      - name: Open task pull request
        if: steps.task.outputs.issue != ''
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_KEY: ${{ steps.task.outputs.issue }}
        run: |
          set -euo pipefail
          test -n "$(git status --porcelain)"
          if [[ -n "$(git status --porcelain -- .github .gitignore)" ]]; then
            echo 'Codex changed protected automation files'; exit 1
          fi
          if git status --porcelain -uall | cut -c4- | grep -Ev '^(Assets|Packages|ProjectSettings)/'; then
            echo 'Codex changed files outside Unity project directories'; exit 1
          fi
          git add -- Assets Packages ProjectSettings
          git diff --cached --check -- '*.cs' '*.py' '*.json' '*.yml' '*.yaml'
          test -n "$(git diff --cached --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "${ISSUE_KEY}: Codex implementation"
          gh auth setup-git
          git push origin HEAD
          pr_url=$(gh pr create --base main --head "$(git branch --show-current)" --title "${ISSUE_KEY}: Codex implementation" --body "Cloud Mode implementation for ${ISSUE_KEY}. Static checks ran in GitHub Actions. Unity import, compilation, prefab, animation, rig, scene, and Play Mode are NOT VERIFIED. Keep this PR open until Unity MCP Mode validation is recorded.")
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
      - name: Report Cloud Mode result to Jira
        if: steps.publish.outputs.pr_url != ''
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_KEY: ${{ steps.task.outputs.issue }}
          PR_URL: ${{ steps.publish.outputs.pr_url }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/jira_tasks.py cloud_report
      - name: Mark failed task as blocked in Jira
        if: failure() && steps.task.outputs.issue != ''
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          ISSUE_KEY: ${{ steps.task.outputs.issue }}
          PR_URL: ${{ steps.publish.outputs.pr_url }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/jira_tasks.py blocked
